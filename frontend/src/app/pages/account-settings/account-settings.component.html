<div class="page">
  <header class="page-header">
    <a class="back-btn" routerLink="/chat" aria-label="Back">
      <lucide-icon [img]="icons.ArrowLeft" size="20"></lucide-icon>
    </a>
    <h1>Profile</h1>
  </header>

  <div class="content">
    <!-- Profile -->
    <section class="card">
      <h2>Profile</h2>

      <div class="avatar-row">
        <div class="avatar-lg">
          <img *ngIf="user?.avatar" [src]="user.avatar" alt="Profile picture" />
          <span *ngIf="!user?.avatar">{{ initials }}</span>
        </div>
        <div class="avatar-actions">
          <label class="secondary-btn" [class.disabled]="savingAvatar">
            <lucide-icon [img]="icons.Camera" size="16"></lucide-icon>
            {{ savingAvatar ? 'Saving…' : (user?.avatar ? 'Change photo' : 'Upload photo') }}
            <input type="file" accept="image/*" hidden (change)="onAvatarSelected($event)" [disabled]="savingAvatar" />
          </label>
          <button *ngIf="user?.avatar" class="link-btn" (click)="removeAvatar()" [disabled]="savingAvatar">Remove</button>
        </div>
      </div>

      <form class="name-form" (ngSubmit)="saveName()">
        <label for="profile-name">Name</label>
        <div class="inline-field">
          <input id="profile-name" type="text" name="name" [(ngModel)]="nameInput" maxlength="100" autocomplete="name" />
          <button type="submit" class="primary-btn" [disabled]="!nameChanged || savingName">
            {{ savingName ? 'Saving…' : 'Save' }}
          </button>
        </div>
      </form>

      <p class="form-error" *ngIf="profileError">{{ profileError }}</p>
      <p class="form-success" *ngIf="profileSaved">{{ profileSaved }}</p>

      <div class="rows">
        <div class="row"><span class="label">Email</span><span class="value">{{ user?.email || '—' }}</span></div>
        <div class="row"><span class="label">Account Type</span><span class="value cap">{{ accountType }}</span></div>
        <div class="row">
          <span class="label">Current Plan</span>
          <span class="value">Free · <a routerLink="/plans">Upgrade</a></span>
        </div>
      </div>
    </section>

    <!-- Change password -->
    <section class="card">
      <h2>Change Password</h2>
      <form class="password-form" (ngSubmit)="changePassword()">
        <label>
          Current password
          <input type="password" name="current" [(ngModel)]="passwordForm.current" autocomplete="current-password" />
        </label>
        <label>
          New password
          <input type="password" name="next" [(ngModel)]="passwordForm.next" autocomplete="new-password" />
        </label>
        <label>
          Confirm new password
          <input type="password" name="confirm" [(ngModel)]="passwordForm.confirm" autocomplete="new-password" />
        </label>
        <p class="hint">At least 8 characters.</p>
        <p class="form-error" *ngIf="passwordError">{{ passwordError }}</p>
        <p class="form-success" *ngIf="passwordSaved">Password changed.</p>
        <button type="submit" class="primary-btn" [disabled]="savingPassword">
          {{ savingPassword ? 'Saving…' : 'Update Password' }}
        </button>
      </form>
    </section>

    <!-- Sign out -->
    <section class="card signout-card">
      <div>
        <h2>Sign Out</h2>
        <p class="muted">Sign out of your account</p>
      </div>
      <button class="signout-btn" (click)="auth.logout()">Sign Out</button>
    </section>
  </div>
</div>

<div class="page">
  <header class="page-header">
    <a class="back-btn" routerLink="/chat" aria-label="Back">
      <lucide-icon [img]="icons.ArrowLeft" size="20"></lucide-icon>
    </a>
    <h1>Upgrade Plan</h1>
  </header>

  <div class="content">
    <section class="card">
      <h2>Upgrade Your Plan</h2>
      <div class="plans">
        <div class="plan" *ngFor="let plan of plans" [class.current]="currentPlan === plan.id">
          <div class="plan-head">
            <h3>{{ plan.name }}</h3>
            <lucide-icon *ngIf="currentPlan === plan.id" [img]="icons.Check" size="16" class="plan-check"></lucide-icon>
          </div>
          <p class="price">{{ plan.price }}</p>
          <ul>
            <li *ngFor="let f of plan.features">
              <lucide-icon [img]="icons.Check" size="14" class="feat-check"></lucide-icon>
              {{ f }}
            </li>
          </ul>
          <a *ngIf="currentPlan !== plan.id" class="upgrade-btn" [href]="planMailto(plan)">{{ plan.cta }}</a>
          <span *ngIf="currentPlan === plan.id" class="current-tag">Current plan</span>
        </div>
      </div>
    </section>

    <section class="card help-card">
      <lucide-icon [img]="icons.MessageCircleQuestion" size="22" class="help-icon"></lucide-icon>
      <div class="help-text">
        <h2>Questions about our plans?</h2>
        <p class="muted">We're happy to help you pick the right one.</p>
      </div>
      <a class="secondary-btn" routerLink="/contact">Contact Us</a>
    </section>
  </div>
</div>
